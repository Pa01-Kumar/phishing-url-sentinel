<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Sentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col items-center pt-20">

    <div class="w-full max-w-2xl px-4">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-blue-400 mb-2">🛡️ Phishing Sentinel</h1>
            <p class="text-gray-400">Paste a suspicious link below to scan it using Machine Learning and real-time heuristics.</p>
        </div>

        <!-- Input Box -->
        <div class="flex gap-2 mb-8">
            <input type="text" id="urlInput" placeholder="https://suspicious-link.com" 
                class="flex-1 p-3 rounded-lg bg-gray-800 border border-gray-700 text-white focus:outline-none focus:border-blue-500 transition-colors">
            <button onclick="scanURL()" id="scanBtn"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors flex items-center justify-center min-w-[100px]">
                Scan
            </button>
        </div>

        <!-- Loading Spinner (Hidden by default) -->
        <div id="loading" class="hidden text-center text-blue-400 mb-8 animate-pulse">
            <p>Analyzing URL via ML models and WHOIS data... (This may take a few seconds)</p>
        </div>

        <!-- Results Area (Hidden by default) -->
        <div id="resultContainer" class="hidden bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-bold">Scan Result</h2>
                <span id="verdictBadge" class="px-4 py-1 rounded-full font-bold text-sm"></span>
            </div>
            
            <div class="mb-6">
                <p class="text-gray-400 text-sm mb-1">Analyzed URL:</p>
                <p id="resultUrl" class="font-mono text-sm break-all bg-gray-900 p-2 rounded"></p>
            </div>

            <!-- Risk Score Bar -->
            <div class="mb-6">
                <div class="flex justify-between mb-1">
                    <span class="text-gray-400 text-sm">Risk Score</span>
                    <span id="riskScoreText" class="font-bold"></span>
                </div>
                <div class="w-full bg-gray-700 rounded-full h-4">
                    <div id="riskBar" class="h-4 rounded-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

                        <!-- Redirect Chain (Hidden by default) -->
            <div id="redirectContainer" class="mb-6 hidden">
                <p class="text-gray-400 text-sm mb-2">Redirect Chain:</p>
                <div id="redirectList" class="flex flex-col gap-2 bg-gray-900 p-3 rounded-lg text-xs font-mono break-all text-yellow-300">
                    <!-- Redirects injected here -->
                </div>
            </div>

            <!-- Details / Checks -->
            <div>
                <p class="text-gray-400 text-sm mb-2">Detection Details:</p>
                <ul id="detailsList" class="space-y-2 text-sm bg-gray-900 p-4 rounded-lg font-mono">
                    <!-- Details injected here -->
                </ul>
            </div>
        </div>
            <!-- Scan History -->
        <div class="mt-8 bg-gray-800 rounded-xl p-6 border border-gray-700 shadow-xl">
            <h2 class="text-xl font-bold mb-4">Recent Scans</h2>
            <ul id="historyList" class="space-y-3 text-sm">
                <!-- History items will be injected here -->
            </ul>
        </div>   
    </div>

    <script>
                // Add this function at the bottom of your script
        async function loadHistory() {
            try {
                const response = await fetch('http://127.0.0.1:8000/history');
                const history = await response.json();
                const historyList = document.getElementById('historyList');
                historyList.innerHTML = ''; // Clear old list

                history.forEach(item => {
                    let colorClass = "text-green-400";
                    if (item.verdict === 'malicious') colorClass = "text-red-400";
                    if (item.verdict === 'suspicious') colorClass = "text-yellow-400";

                    const li = document.createElement('li');
                    li.className = "flex justify-between border-b border-gray-700 pb-2";
                    li.innerHTML = `
                        <span class="truncate w-1/2">${item.url}</span>
                        <span class="${colorClass} font-bold uppercase">${item.verdict}</span>
                        <span class="text-gray-500 text-xs">${item.timestamp}</span>
                    `;
                    historyList.appendChild(li);
                });
            } catch (error) {
                console.error("Failed to load history", error);
            }
        }

        async function scanURL() {
            const urlInput = document.getElementById('urlInput').value;
            if (!urlInput) return alert('Please enter a URL');

            // UI Updates
            document.getElementById('scanBtn').disabled = true;
            document.getElementById('scanBtn').innerText = 'Scanning...';
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');

            try {
                const response = await fetch('http://127.0.0.1:8000/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });

                const data = await response.json();
                displayResult(data);
            } catch (error) {
                alert("Error connecting to backend. Is the server running?");
                console.error(error);
            } finally {
                document.getElementById('scanBtn').disabled = false;
                document.getElementById('scanBtn').innerText = 'Scan';
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function displayResult(data) {
            document.getElementById('resultContainer').classList.remove('hidden');
            document.getElementById('resultUrl').innerText = data.url;
            
            // Update Risk Score
            const score = data.risk_score;
            document.getElementById('riskScoreText').innerText = (score * 100).toFixed(1) + '%';
            
            const riskBar = document.getElementById('riskBar');
            riskBar.style.width = (score * 100) + '%';

            // Update Verdict Badge
            const badge = document.getElementById('verdictBadge');
            badge.innerText = data.verdict.toUpperCase();
            badge.className = "px-4 py-1 rounded-full font-bold text-sm ";
            
            if (data.verdict === 'malicious') {
                riskBar.className = "h-4 rounded-full transition-all duration-1000 bg-red-500";
                badge.className += "bg-red-500 text-white";
            } else if (data.verdict === 'suspicious') {
                riskBar.className = "h-4 rounded-full transition-all duration-1000 bg-yellow-500";
                badge.className += "bg-yellow-500 text-black";
            } else {
                riskBar.className = "h-4 rounded-full transition-all duration-1000 bg-green-500";
                badge.className += "bg-green-500 text-white";
            }

            // Populate Redirect Chain
            const redirectContainer = document.getElementById('redirectContainer');
            const redirectList = document.getElementById('redirectList');
            redirectList.innerHTML = '';
            
            if (data.details.redirect_chain && data.details.redirect_chain.length > 1) {
                redirectContainer.classList.remove('hidden');
                data.details.redirect_chain.forEach((link, index) => {
                    const p = document.createElement('div');
                    p.innerText = (index > 0 ? "⬇️ " : "📍 ") + link;
                    redirectList.appendChild(p);
                });
            } else {
                redirectContainer.classList.add('hidden');
            }

            // Populate Details
            const detailsList = document.getElementById('detailsList');
            detailsList.innerHTML = '';
            
            const checks = data.details.checks;
            for (const [key, value] of Object.entries(checks)) {
                const li = document.createElement('li');
                li.innerHTML = `<span class="text-blue-400">${key}:</span> <span class="text-gray-300">${JSON.stringify(value)}</span>`;
                detailsList.appendChild(li);
            }
        loadHistory(); 
        }
    window.onload = loadHistory; 
    </script>
</body>
</html>
